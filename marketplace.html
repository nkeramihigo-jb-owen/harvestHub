<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HarvestHub | Marketplace</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <div class="container marketplace-header">

            <a href="marketplace.html" class="logo">HarvestHub</a>

            <nav class="main-nav">
                <a href="marketplace.html" class="nav-link active">Marketplace</a>
                <a href="cart.html" class="nav-link">My Cart</a>
                <button type="button" id="logoutButton" class="logout-button">
                    Logout
                </button>
            </nav>

        </div>
    </header>

    <main class="marketplace-main">

        <section class="marketplace-welcome">
            <div class="container">

                <p class="welcome-label">YOUR FARM MARKETPLACE</p>

                <h1>Fresh from the Farm</h1>

                <p>
                    Discover quality farm produce and shop directly
                    from local farming businesses.
                </p>

            </div>
        </section>

        <section class="products-section">
            <div class="container">

                <div class="products-heading">
                    <div>
                        <h2>Available Products</h2>
                        <p>Explore what's available in our marketplace.</p>
                    </div>

                    <span id="productCount" class="product-count">
                        0 Products
                    </span>
                </div>

                <form id="productSearchForm" class="search-form">

                    <input
                        type="search"
                        id="productSearch"
                        placeholder="Search for products..."
                        aria-label="Search for products"
                    >

                    <button type="submit" class="btn btn-primary">
                        Search
                    </button>

                </form>

                <p id="searchMessage" class="search-message"
                   aria-live="polite"></p>

                <div id="productGrid" class="product-grid">

                    <!-- JavaScript will display the products here. -->

                </div>

            </div>
        </section>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 HarvestHub. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
