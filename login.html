<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarvestHub | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>


<header class="site-header">
    <div class="container">
        <a href="index.html" class="logo">HarvestHub</a>
    </div>
</header>

<main class="login-section">
    <div class="login-card">

        <h1>Welcome Back</h1>
        <p class="login-description">
            Login to explore fresh products from local farmers.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="buyerName">Your Name</label>
                <input
                    type="text"
                    id="buyerName"
                    name="buyerName"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="buyerPassword">Password</label>
                <input
                    type="password"
                    id="buyerPassword"
                    name="buyerPassword"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <p id="loginMessage" class="form-message" aria-live="polite"></p>

            <button type="submit" class="btn btn-primary login-btn">
                Login
            </button>

        </form>

        <p class="login-note">
            Demo login — no account registration required.
        </p>

    </div>
</main>

<footer class="site-footer">
    <p>&copy; 2026 HarvestHub. All rights reserved.</p>
</footer>

<script src="js/app.js"></script>


</body>
</html>
